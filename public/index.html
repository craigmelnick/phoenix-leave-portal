<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Leave &amp; Attendance Portal</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="login-wrap" id="loginScreen"></div>

<div class="app" id="app" style="display:none;">

  <div class="sidebar">
    <div class="sidebar-logo-card"><img src="/assets/logo-wordmark.jpg" alt="Phoenix International Logistics"></div>
    <div class="brand">Leave &amp; Attendance Portal</div>
    <div id="nav"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <p class="topbar-eyebrow" id="topbarDate"></p>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <div class="bell" id="bellBtn">🔔<span class="badge" id="bellBadge" style="display:none;"></span></div>
        <div class="account-avatar" id="accountAvatar" title="Log out" onclick="logout()">--</div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="bottom-nav" id="bottomNav"></div>
  </div>

</div>

<script src="/app.js"></script>
</body>
</html>
